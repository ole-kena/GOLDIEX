
name: Build GOLDIE APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract GOLDIE source
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in repository root."
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d project
          ANDROID_DIR="$(find project -type f -path '*/android/app/build.gradle' -print -quit | sed 's#/app/build.gradle$##')"
          if [ -z "$ANDROID_DIR" ]; then
            echo "Could not find Android project."
            find project -maxdepth 6 -type f | head -100
            exit 1
          fi
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Found Android project at: $ANDROID_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Align Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          android_dir = Path(os.environ["ANDROID_DIR"])
          gradle_file = android_dir / "app" / "build.gradle"
          source = gradle_file.read_text()

          if "compileOptions {" not in source:
              source = source.replace(
                  "\n    defaultConfig {",
                  "\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n\n    defaultConfig {",
                  1
              )

          if "kotlinOptions {" not in source:
              source = source.replace(
                  "\n    dependencies {",
                  "\n    kotlinOptions {\n        jvmTarget = '17'\n    }\n\n    dependencies {",
                  1
              )

          gradle_file.write_text(source)
          PY

      - name: Build APK
        run: gradle -p "$ANDROID_DIR" --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GOLDIE-DEBUG-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
