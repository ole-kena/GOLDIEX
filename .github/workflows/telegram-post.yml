
name: GOLDIE Daily Telegram Education

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GOLDIE
        uses: actions/checkout@v4

      - name: Publish daily lesson
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL: "@GOLDIE_Official_Channel"
        run: |
          set -e

          DAY=$(date -u +%j)

          MESSAGE=$(jq -r --argjson day "$DAY" \
            '.[] | select(.day == $day) | .message' \
            content/daily-tips.json)

          if [ -z "$MESSAGE" ] || [ "$MESSAGE" = "null" ]; then
            echo "No lesson found for day $DAY"
            exit 1
          fi

          curl --fail-with-body -sS -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHANNEL}" \
            --data-urlencode "text=${MESSAGE}"
